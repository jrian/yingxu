name: Deploy FRAME to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Stage runtime only
        shell: bash
        run: |
          mkdir -p _site
          cp index.html pinterest-board.html .nojekyll _site/
          cp ./*.js ./*.css _site/
          cp -R data assets _site/
          test ! -e _site/.git
          test ! -e _site/.github
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
